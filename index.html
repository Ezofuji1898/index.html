<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>カレンダーをつくろう</title>
<style>
:root{
  --bg:#f4f6fa;
  --card:#fff;
  --line:#cfd5df;
  --text:#222;
  --muted:#667085;
  --accent:#3b82f6;
  --danger:#d94b4b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--text);
}
.app{max-width:1180px;margin:0 auto;padding:14px}
h1{font-size:clamp(26px,4vw,40px);margin:0 0 8px}
.note{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 12px}
.toolbar,.tray,.actions,.name-panel{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;
}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input{
  font:inherit;
}
button{
  border:2px solid var(--line);background:#fff;border-radius:12px;
  padding:10px 14px;font-weight:700;cursor:pointer;
}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{border-color:var(--danger);color:var(--danger)}
select,input{
  border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;
}
.board-wrap{
  background:#e9edf5;padding:14px;border-radius:18px;overflow:auto;
}
#calendarBoard{
  position:relative;
  width:794px;
  min-height:1123px;
  background:#fff;
  border:2px solid #222;
  margin:0 auto;
  user-select:none;
  touch-action:none;
}
.topline{
  position:absolute;left:28px;right:28px;top:22px;height:88px;
  display:grid;grid-template-columns:1.15fr .55fr 3.30fr;gap:12px;align-items:center;
}
.namebox,.monthbox,.yearbox{
  border:2px solid #222;border-radius:12px;height:64px;
  display:flex;align-items:center;justify-content:center;
  background:#fff;position:relative;
}
.namebox{padding:8px}
#nameDisplay{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;cursor:pointer;
}
.monthbox{font-size:34px;font-weight:800}
.yearbox{font-size:21px;font-weight:700}
.ruby-label{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.05;
}
.ruby-label .furigana{font-size:10px;font-weight:600;letter-spacing:.02em;margin-bottom:2px;white-space:nowrap}
.ruby-label .kanji{font-size:1em;font-weight:800}
.item.weekday.sat,.token.weekday-sat{color:#1f5fd1}
.item.weekday.sun,.token.weekday-sun{color:#d43f3f}
.item.date.sat,.token.date-sat{color:#1f5fd1}
.item.date.sun,.token.date-sun{color:#d43f3f}

.grid{
  position:absolute;left:28px;right:28px;top:128px;height:675px;
  display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:52px repeat(6,1fr);
}
.cell{
  border-right:1px solid #111;border-bottom:1px solid #111;
  position:relative;overflow:hidden;
}
.cell:nth-child(7n+1){border-left:1px solid #111}
.cell:nth-child(-n+7){border-top:1px solid #111}
.weekcell{background:#f8f9fb}
.item{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
  background:transparent;
  font-weight:800;cursor:grab;touch-action:none;z-index:5;
}
.item.selected{outline:3px solid rgba(59,130,246,.45)}
.item.month{font-size:38px;min-width:100px;min-height:50px}
.item.weekday{font-size:20px;min-width:90px;min-height:44px}
.item.date{font-size:26px;min-width:34px;min-height:34px;justify-content:flex-start}
.tray-title{font-size:18px;font-weight:800;margin-bottom:8px}
.tokenrow{display:flex;gap:8px;flex-wrap:wrap;min-height:58px}
.token{
  border:2px solid var(--line);border-radius:10px;background:#fff;
  padding:8px 11px;font-size:18px;font-weight:800;
  cursor:grab;touch-action:none;user-select:none;
}
.token.dragging{opacity:.45}
.help{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.45}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.kana-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:none;align-items:center;justify-content:center;z-index:9999;
}
.kana-modal.show{display:flex}
.kana-box{
  width:min(760px,94vw);max-height:90vh;overflow:auto;
  background:#fff;border-radius:18px;padding:16px;border:2px solid #bbb;
}
.kana-preview{
  min-height:60px;border:2px solid var(--line);border-radius:12px;
  display:flex;align-items:center;padding:10px 14px;font-size:30px;font-weight:800;
  margin-bottom:12px;
}
.kana-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
}
.kana-grid button{font-size:24px;min-height:54px;padding:6px}
.kana-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.item.image{
  padding:0;
  background:transparent;
  border-radius:8px;
  min-width:auto;
  min-height:auto;
  overflow:visible;
}
.item.image img{
  display:block;
  width:180px;
  max-width:300px;
  max-height:155px;
  object-fit:contain;
  pointer-events:none;
  border-radius:8px;
}
.image-controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}
.image-name{
  font-size:14px;
  color:var(--muted);
}

.image-frame{
  position:absolute;
  left:28px;
  right:28px;
  top:830px;
  height:255px;
  border:2px solid #222;
  border-radius:14px;
  background:#fafafa;
}
.image-frame-title{
  display:none;
}
.image-frame-title .furigana{
  font-size:10px;
  display:block;
  text-align:center;
  line-height:1.1;
}
.image-frame-body{
  position:absolute;
  left:10px;right:10px;top:10px;bottom:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.image-slot{
  position:relative;
  border:1.5px dashed #9aa3b2;
  border-radius:10px;
  background:#fff;
}
.image-slot-label{
  position:absolute;
  left:8px;
  top:5px;
  font-size:12px;
  color:#7b8492;
  font-weight:700;
  z-index:2;
}
.image-slot-label .furigana{
  font-size:9px;
  line-height:1;
  margin-bottom:1px;
}
.image-slot-label .kanji{
  font-size:12px;
  line-height:1.05;
}


@media print{
  @page{size:A4 portrait;margin:8mm;}
  body{background:#fff;}
  .toolbar,.tray,.actions,.help,.note,h1{display:none !important;}
  .app{padding:0;margin:0;max-width:none;}
  .board-wrap{background:#fff;padding:0;border-radius:0;overflow:visible;}
  #calendarBoard{
    width:194mm;
    min-height:274mm;
    height:274mm;
    border:1px solid #000;
    transform:none !important;
  }
}

.resize-handle{
  position:absolute;
  width:26px;
  height:26px;
  right:-12px;
  bottom:-12px;
  border-radius:50%;
  border:2px solid #fff;
  background:var(--accent);
  box-shadow:0 1px 5px rgba(0,0,0,.25);
  cursor:nwse-resize;
  touch-action:none;
  display:none;
  z-index:20;
}
.item.image.selected .resize-handle{
  display:block;
}

.image-drag-handle{
  position:absolute;
  left:50%;
  top:-38px;
  transform:translateX(-50%);
  min-width:110px;
  height:34px;
  padding:4px 14px;
  border-radius:12px;
  border:2px solid var(--accent);
  background:#fff;
  color:#222;
  font-size:16px;
  font-weight:800;
  display:none;
  align-items:center;
  justify-content:center;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  z-index:30;
}
.item.image.selected .image-drag-handle{
  display:none;
}

.image-move-panel{
  position:absolute;
  left:50%;
  top:-62px;
  transform:translateX(-50%);
  display:none;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  width:300px;
  z-index:40;
  background:#fff;
  border:2px solid var(--line);
  border-radius:12px;
  padding:6px;
}
.item.image.selected .image-move-panel{
  display:flex;
}
.image-move-panel button{
  min-width:48px;
  min-height:44px;
  padding:6px 10px;
  font-size:18px;
  border-radius:10px;
}

.crop-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
}
.crop-modal.show{display:flex}
.crop-box{
  width:min(760px,94vw);
  background:#fff;
  border-radius:18px;
  padding:16px;
  border:2px solid #bbb;
}
.crop-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:10px;
}
.crop-stage{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  background:#e9edf5;
  border:2px solid #222;
  overflow:hidden;
  touch-action:none;
}
.crop-stage img{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
}
.crop-window{
  position:absolute;
  left:8%;
  right:8%;
  top:10%;
  bottom:10%;
  border:3px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 9999px rgba(0,0,0,.35);
  pointer-events:none;
}
.crop-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.crop-controls button{flex:1 1 120px}

.image-slot{
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.slot-image-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 8px 52px;
}
.slot-image-wrap img{
  display:block;
  width:70%;
  height:auto;
  max-width:95%;
  max-height:78%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}
.slot-image-controls{
  position:absolute;
  left:50%;
  bottom:6px;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:5;
  background:rgba(255,255,255,.96);
  padding:5px;
  border-radius:10px;
  border:1px solid var(--line);
}
.slot-image-controls button{
  min-height:40px;
  padding:5px 10px;
  font-size:15px;
  border-radius:8px;
}

</style>
</head>
<body>
<div class="app">
  <h1>カレンダーを つくろう</h1>
  <p class="note">カードを指でつかんで動かすと、月・曜日・日にちはそれぞれ決まった場所へ自動で入ります。</p>

  <div class="toolbar">
    <label>ねん
      <select id="yearSel"></select>
    </label>
    <button id="resetBtn">ぜんぶ もどす</button>
    <button id="saveBtn" class="primary">PNGで ほぞん</button>
  </div>

  <div class="board-wrap">
    <div id="calendarBoard">
      <div class="topline">
        <div id="yearBox" class="yearbox"><span class="ruby-label"><span class="furigana">せいれき</span><span class="kanji">西暦</span></span>&nbsp;2026ねん</div>
        <div id="monthBox" class="monthbox"><span class="ruby-label"><span class="furigana">つき</span><span class="kanji">月</span></span></div>
        <div class="namebox"><div id="nameDisplay"><span class="ruby-label"><span class="furigana">なまえ</span><span class="kanji">名前</span></span></div></div>
      </div>
      <div id="grid" class="grid"></div>
      <div id="imageFrame" class="image-frame">
        <div class="image-frame-title"></div>
        <div class="image-frame-body">
          <div id="imageSlot1" class="image-slot">
            <span class="image-slot-label ruby-label"><span class="furigana">がぞう1</span><span class="kanji">画像1</span></span>
          </div>
          <div id="imageSlot2" class="image-slot">
            <span class="image-slot-label ruby-label"><span class="furigana">がぞう2</span><span class="kanji">画像2</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tray">
    <div class="tray-title">① つき</div>
    <div id="monthTokens" class="tokenrow"></div>
  </div>

  <div class="tray">
    <div class="tray-title">② ようび</div>
    <div id="weekdayTokens" class="tokenrow"></div>
  </div>

  <div class="tray">
    <div class="tray-title">③ ひにち</div>
    <div id="dateTokens" class="tokenrow"></div>
  </div>

  <div class="tray">
    <div class="tray-title">④ すきな画像</div>
    <div class="image-controls">
      <input id="imageInput" type="file" accept="image/*" style="
        display:block;
        max-width:100%;
        border:2px solid var(--line);
        background:#fff;
        border-radius:12px;
        padding:10px 12px;
        font-weight:700;
        cursor:pointer;
      ">
      <span id="imageName" class="image-name"></span>
    </div>
    <div class="help">画像を選ぶと、画像1・画像2の枠へ順番に直接入ります。画像はドラッグしません。「大きく」「小さく」「けす」で調整できます。</div>
  </div>

  <div class="actions">
    <button id="deleteSelected" class="danger">えらんだものを けす</button>
  </div>
  <div class="help">日にちは各マスの左上に自動配置されます。マスの中央から下は、あとで予定を書いたり画像を置いたりできるスペースとして残しています。</div>
</div>

<div id="kanaModal" class="kana-modal">
  <div class="kana-box">
    <div id="kanaPreview" class="kana-preview"></div>
    <div id="kanaGrid" class="kana-grid"></div>
    <div class="kana-actions">
      <button id="dakutenBtn">゛</button>
      <button id="handakutenBtn">゜</button>
      <button id="smallBtn">ちいさく</button>
      <button id="spaceBtn">スペース</button>
      <button id="backBtn">1もじ けす</button>
      <button id="clearNameBtn">ぜんぶ けす</button>
      <button id="nameOkBtn" class="primary">けってい</button>
      <button id="nameCancelBtn">やめる</button>
    </div>
  </div>
</div>

<script>
const board=document.getElementById('calendarBoard');
const grid=document.getElementById('grid');
const monthTokens=document.getElementById('monthTokens');
const weekdayTokens=document.getElementById('weekdayTokens');
const dateTokens=document.getElementById('dateTokens');
const yearSel=document.getElementById('yearSel');
const yearBox=document.getElementById('yearBox');
const monthBox=document.getElementById('monthBox');

let selectedItem=null;
let zCounter=10;
let kanaBuffer='';

for(let y=2025;y<=2030;y++){
  const o=document.createElement('option');
  o.value=y;o.textContent=y+'ねん';
  if(y===2026)o.selected=true;
  yearSel.appendChild(o);
}
yearSel.addEventListener('change',()=>{
  yearBox.innerHTML='<span class="ruby-label"><span class="furigana">せいれき</span><span class="kanji">西暦</span></span>&nbsp;'+yearSel.value+'ねん';
});

// 7 weekday cells + 42 day cells
for(let i=0;i<49;i++){
  const c=document.createElement('div');
  c.className='cell'+(i<7?' weekcell':'');
  c.dataset.index=i;
  grid.appendChild(c);
}

function selectItem(el){
  document.querySelectorAll('.item.selected').forEach(x=>x.classList.remove('selected'));
  selectedItem=el;
  if(el) el.classList.add('selected');
}

function getBoardCoords(clientX,clientY){
  const br=board.getBoundingClientRect();
  const sx=board.offsetWidth/br.width, sy=board.offsetHeight/br.height;
  return {x:(clientX-br.left)*sx,y:(clientY-br.top)*sy};
}

function getGridGeometry(){
  return {left:28,top:128,width:738,height:675,headH:52,rowH:(675-52)/6,colW:738/7};
}

function snapPlacedItem(el){
  const type=el.dataset.type;
  const value=el.dataset.value;
  const g=getGridGeometry();

  if(type==='image'){
    const br=board.getBoundingClientRect();
    const sx=board.offsetWidth/br.width, sy=board.offsetHeight/br.height;
    const slots=[document.getElementById('imageSlot1'),document.getElementById('imageSlot2')];
    const elLeft=parseFloat(el.style.left)||0;
    const elTop=parseFloat(el.style.top)||0;
    const elCx=elLeft+el.offsetWidth/2;
    const elCy=elTop+el.offsetHeight/2;

    let best=null, bestDist=Infinity;
    slots.forEach(slot=>{
      const sr=slot.getBoundingClientRect();
      const cx=(sr.left-br.left)*sx + (sr.width*sx)/2;
      const cy=(sr.top-br.top)*sy + (sr.height*sy)/2;
      const d=(elCx-cx)*(elCx-cx)+(elCy-cy)*(elCy-cy);
      if(d<bestDist){bestDist=d;best={slot,sr,cx,cy};}
    });

    if(best){
      const left=best.cx-el.offsetWidth/2;
      const top=best.cy-el.offsetHeight/2+8;
      el.style.left=left+'px';
      el.style.top=top+'px';
    }
    return;
  }

  if(type==='month'){
    // center inside month box
    const box=monthBox.getBoundingClientRect();
    const br=board.getBoundingClientRect();
    const sx=board.offsetWidth/br.width, sy=board.offsetHeight/br.height;
    const left=(box.left-br.left)*sx + (box.width*sx-el.offsetWidth)/2;
    const top=(box.top-br.top)*sy + (box.height*sy-el.offsetHeight)/2;
    el.style.left=left+'px';el.style.top=top+'px';
    return;
  }

  const left=parseFloat(el.style.left)||0;
  const top=parseFloat(el.style.top)||0;
  const cx=left+el.offsetWidth/2;
  const cy=top+el.offsetHeight/2;

  if(type==='weekday'){
    let col=Math.round((cx-g.left-g.colW/2)/g.colW);
    col=Math.max(0,Math.min(6,col));
    el.style.left=(g.left+col*g.colW+(g.colW-el.offsetWidth)/2)+'px';
    el.style.top=(g.top+(g.headH-el.offsetHeight)/2)+'px';
    return;
  }

  if(type==='date'){
    let col=Math.floor((cx-g.left)/g.colW);
    let row=Math.floor((cy-(g.top+g.headH))/g.rowH);
    col=Math.max(0,Math.min(6,col));
    row=Math.max(0,Math.min(5,row));
    el.style.left=(g.left+col*g.colW+7)+'px';
    el.style.top=(g.top+g.headH+row*g.rowH+5)+'px';
    return;
  }
}

function makePlacedDraggable(el){
  let dragging=false,dx=0,dy=0;

  function startDrag(clientX,clientY){
    dragging=true;
    selectItem(el);
    el.style.zIndex=++zCounter;
    const r=el.getBoundingClientRect();
    dx=clientX-r.left;
    dy=clientY-r.top;
  }

  function moveDrag(clientX,clientY){
    if(!dragging)return;
    const p=getBoardCoords(clientX,clientY);
    let x=p.x-dx*(board.offsetWidth/board.getBoundingClientRect().width);
    let y=p.y-dy*(board.offsetHeight/board.getBoundingClientRect().height);
    x=Math.max(0,Math.min(x,board.clientWidth-el.offsetWidth));
    y=Math.max(0,Math.min(y,board.clientHeight-el.offsetHeight));
    el.style.left=x+'px';
    el.style.top=y+'px';
  }

  function endDrag(){
    if(!dragging)return;
    dragging=false;
    snapPlacedItem(el);
  }

  el.addEventListener('pointerdown',e=>{
    if(e.target.classList && e.target.classList.contains('resize-handle')) return;
    startDrag(e.clientX,e.clientY);
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });

  el.addEventListener('pointermove',e=>{
    if(!dragging)return;
    moveDrag(e.clientX,e.clientY);
    e.preventDefault();
  });

  el.addEventListener('pointerup',e=>{
    try{el.releasePointerCapture(e.pointerId);}catch(_){}
    endDrag();
  });

  el.addEventListener('pointercancel',endDrag);

  // iPad / iPhone Safari fallback
  el.addEventListener('touchstart',e=>{
    if(e.target.classList && e.target.classList.contains('resize-handle')) return;
    if(!e.touches || !e.touches.length) return;
    const t=e.touches[0];
    startDrag(t.clientX,t.clientY);
    e.preventDefault();
  },{passive:false});

  el.addEventListener('touchmove',e=>{
    if(!dragging || !e.touches || !e.touches.length) return;
    const t=e.touches[0];
    moveDrag(t.clientX,t.clientY);
    e.preventDefault();
  },{passive:false});

  el.addEventListener('touchend',e=>{
    endDrag();
    e.preventDefault();
  },{passive:false});

  el.addEventListener('touchcancel',endDrag,{passive:false});
}

function placeToken(token,clientX,clientY){
  const p=getBoardCoords(clientX,clientY);
  const el=document.createElement('div');
  el.className='item '+token.dataset.type;
  if(token.dataset.type==='weekday'){
    const first=token.dataset.value.charAt(0);
    const readingMap={'月':'げつようび','火':'かようび','水':'すいようび','木':'もくようび','金':'きんようび','土':'どようび','日':'にちようび'};
    el.innerHTML='<span class="ruby-label"><span class="furigana">'+readingMap[first]+'</span><span class="kanji">'+first+'曜日</span></span>';
  }else if(token.dataset.type==='month'){
    const num=token.dataset.value.replace('月','');
    el.innerHTML=num+'<span class="ruby-label"><span class="furigana">がつ</span><span class="kanji">月</span></span>';
  }else{
    el.textContent=token.dataset.value;
  }
  if(token.dataset.type==='weekday' && token.dataset.value.startsWith('土')) el.classList.add('sat');
  if(token.dataset.type==='weekday' && token.dataset.value.startsWith('日')) el.classList.add('sun');
  el.dataset.type=token.dataset.type;
  el.dataset.value=token.dataset.value;
  el.style.left=Math.max(0,Math.min(p.x-30,board.clientWidth-90))+'px';
  el.style.top=Math.max(0,Math.min(p.y-20,board.clientHeight-60))+'px';
  el.style.zIndex=++zCounter;
  board.appendChild(el);
  makePlacedDraggable(el);
  token.remove();
  selectItem(el);
  requestAnimationFrame(()=>snapPlacedItem(el));
}

function makeTokenDraggable(token){
  let dragging=false,ghost=null;
  token.addEventListener('pointerdown',e=>{
    dragging=true;token.classList.add('dragging');
    token.setPointerCapture(e.pointerId);
    ghost=token.cloneNode(true);
    ghost.style.position='fixed';ghost.style.left=(e.clientX-25)+'px';ghost.style.top=(e.clientY-20)+'px';
    ghost.style.zIndex='9999';ghost.style.pointerEvents='none';ghost.style.opacity='.9';
    document.body.appendChild(ghost);e.preventDefault();
  });
  token.addEventListener('pointermove',e=>{
    if(!dragging||!ghost)return;
    ghost.style.left=(e.clientX-25)+'px';ghost.style.top=(e.clientY-20)+'px';
  });
  token.addEventListener('pointerup',e=>{
    if(!dragging)return;
    dragging=false;token.classList.remove('dragging');
    if(ghost){ghost.remove();ghost=null;}
    const br=board.getBoundingClientRect();
    if(e.clientX>=br.left&&e.clientX<=br.right&&e.clientY>=br.top&&e.clientY<=br.bottom){
      placeToken(token,e.clientX,e.clientY);
    }
  });
  token.addEventListener('pointercancel',()=>{
    dragging=false;token.classList.remove('dragging');
    if(ghost){ghost.remove();ghost=null;}
  });
}

function addToken(parent,label,type){
  const token=document.createElement('div');
  token.className='token';
  if(type==='weekday'){
    const first=label.charAt(0);
    const readingMap={'月':'げつようび','火':'かようび','水':'すいようび','木':'もくようび','金':'きんようび','土':'どようび','日':'にちようび'};
    token.innerHTML='<span class="ruby-label"><span class="furigana">'+readingMap[first]+'</span><span class="kanji">'+first+'曜日</span></span>';
    if(label.startsWith('土')) token.classList.add('weekday-sat');
    if(label.startsWith('日')) token.classList.add('weekday-sun');
  }else if(type==='month'){
    const num=label.replace('月','');
    token.innerHTML=num+'<span class="ruby-label"><span class="furigana">がつ</span><span class="kanji">月</span></span>';
  }else{
    token.textContent=label;
  }
  token.dataset.type=type;token.dataset.value=label;
  makeTokenDraggable(token);parent.appendChild(token);
}

function buildTokens(){
  monthTokens.innerHTML='';weekdayTokens.innerHTML='';dateTokens.innerHTML='';
  for(let m=1;m<=12;m++) addToken(monthTokens,m+'月','month');
  ['月曜日','火曜日','水曜日','木曜日','金曜日','土曜日','日曜日'].forEach(w=>addToken(weekdayTokens,w,'weekday'));
  for(let d=1;d<=31;d++) addToken(dateTokens,String(d),'date');
}

function makeImageButtonControls(el,img,panel){
  const step=14;

  function moveBy(dx,dy){
    const left=(parseFloat(el.style.left)||0)+dx;
    const top=(parseFloat(el.style.top)||0)+dy;
    const x=Math.max(0,Math.min(left,board.clientWidth-el.offsetWidth));
    const y=Math.max(0,Math.min(top,board.clientHeight-el.offsetHeight));
    el.style.left=x+'px';
    el.style.top=y+'px';
  }

  function resizeBy(factor){
    const current=img.getBoundingClientRect();
    let newW=current.width*factor;
    newW=Math.max(70,Math.min(newW,360));
    img.style.width=newW+'px';
    img.style.height='auto';
  }

  panel.querySelector('[data-act="left"]').addEventListener('click',e=>{
    e.stopPropagation(); moveBy(-step,0);
  });
  panel.querySelector('[data-act="right"]').addEventListener('click',e=>{
    e.stopPropagation(); moveBy(step,0);
  });
  panel.querySelector('[data-act="up"]').addEventListener('click',e=>{
    e.stopPropagation(); moveBy(0,-step);
  });
  panel.querySelector('[data-act="down"]').addEventListener('click',e=>{
    e.stopPropagation(); moveBy(0,step);
  });
  panel.querySelector('[data-act="bigger"]').addEventListener('click',e=>{
    e.stopPropagation(); resizeBy(1.12);
  });
  panel.querySelector('[data-act="smaller"]').addEventListener('click',e=>{
    e.stopPropagation(); resizeBy(0.88);
  });
  panel.querySelector('[data-act="delete"]').addEventListener('click',e=>{
    e.stopPropagation();
    el.remove();
    selectedItem=null;
  });
}

function makeImageResizable(el,img,handle){
  let resizing=false;
  let startX=0, startY=0, startW=0, startH=0, aspect=1;

  handle.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    e.preventDefault();
    resizing=true;
    selectItem(el);
    handle.setPointerCapture(e.pointerId);

    const r=img.getBoundingClientRect();
    startX=e.clientX;
    startY=e.clientY;
    startW=r.width;
    startH=r.height;
    aspect=startW/startH || 1;
  });

  handle.addEventListener('pointermove',e=>{
    if(!resizing)return;
    e.stopPropagation();
    e.preventDefault();

    const dx=e.clientX-startX;
    const dy=e.clientY-startY;

    // Use the larger proportional movement to make touch resizing natural.
    let newW=startW+dx;
    let newH=startH+dy;

    if(Math.abs(dx) >= Math.abs(dy)){
      newW=startW+dx;
      newW=Math.max(70,Math.min(newW,360));
      newH=newW/aspect;
    }else{
      newH=startH+dy;
      newH=Math.max(55,Math.min(newH,220));
      newW=newH*aspect;
      if(newW>360){
        newW=360;
        newH=newW/aspect;
      }
      if(newW<70){
        newW=70;
        newH=newW/aspect;
      }
    }

    img.style.width=newW+'px';
    img.style.height='auto';
  });

  handle.addEventListener('pointerup',e=>{
    resizing=false;
    try{handle.releasePointerCapture(e.pointerId);}catch(_){}
    snapPlacedItem(el);
  });

  handle.addEventListener('pointercancel',e=>{
    resizing=false;
    try{handle.releasePointerCapture(e.pointerId);}catch(_){}
    snapPlacedItem(el);
  });
}


let cropTargetEl=null;
let cropTargetImg=null;
let cropScale=1;
let cropOffsetX=0;
let cropOffsetY=0;
let cropDragging=false;
let cropStartX=0, cropStartY=0;
let cropStartOffsetX=0, cropStartOffsetY=0;

function enableCropOpen(el,img){
  let tapTimer=null;
  el.addEventListener('click',e=>{
    if(e.target.classList && e.target.classList.contains('resize-handle')) return;
    if(tapTimer){
      clearTimeout(tapTimer);
      tapTimer=null;
      openCropModal(el,img);
    }else{
      tapTimer=setTimeout(()=>{tapTimer=null;},280);
    }
  });
}

function openCropModal(el,img){
  cropTargetEl=el;
  cropTargetImg=img;
  const modal=document.getElementById('cropModal');
  const cropImg=document.getElementById('cropImg');
  cropImg.src=img.src;
  cropScale=1;
  cropOffsetX=0;
  cropOffsetY=0;
  cropImg.style.width='auto';
  cropImg.style.height='auto';
  cropImg.style.maxWidth='none';
  cropImg.style.maxHeight='none';
  requestAnimationFrame(()=>{
    const stage=document.getElementById('cropStage');
    const sr=stage.getBoundingClientRect();
    const ir=cropImg.naturalWidth/cropImg.naturalHeight;
    const srRatio=sr.width/sr.height;
    if(ir>srRatio){
      cropImg.style.height=sr.height+'px';
      cropImg.style.width='auto';
    }else{
      cropImg.style.width=sr.width+'px';
      cropImg.style.height='auto';
    }
    updateCropTransform();
  });
  modal.classList.add('show');
}

function updateCropTransform(){
  const cropImg=document.getElementById('cropImg');
  cropImg.style.transform=`translate(calc(-50% + ${cropOffsetX}px), calc(-50% + ${cropOffsetY}px)) scale(${cropScale})`;
}

const cropStage=document.getElementById('cropStage');
cropStage.addEventListener('pointerdown',e=>{
  cropDragging=true;
  cropStartX=e.clientX;
  cropStartY=e.clientY;
  cropStartOffsetX=cropOffsetX;
  cropStartOffsetY=cropOffsetY;
  cropStage.setPointerCapture(e.pointerId);
});
cropStage.addEventListener('pointermove',e=>{
  if(!cropDragging)return;
  cropOffsetX=cropStartOffsetX+(e.clientX-cropStartX);
  cropOffsetY=cropStartOffsetY+(e.clientY-cropStartY);
  updateCropTransform();
});
cropStage.addEventListener('pointerup',()=>cropDragging=false);
cropStage.addEventListener('pointercancel',()=>cropDragging=false);

document.getElementById('cropZoomIn').addEventListener('click',()=>{
  cropScale=Math.min(3,cropScale*1.15);
  updateCropTransform();
});
document.getElementById('cropZoomOut').addEventListener('click',()=>{
  cropScale=Math.max(.5,cropScale/1.15);
  updateCropTransform();
});
document.getElementById('cropCancel').addEventListener('click',()=>{
  document.getElementById('cropModal').classList.remove('show');
});

document.getElementById('cropApply').addEventListener('click',()=>{
  if(!cropTargetImg)return;
  const stage=document.getElementById('cropStage');
  const cropImg=document.getElementById('cropImg');
  const windowEl=stage.querySelector('.crop-window');
  const sr=stage.getBoundingClientRect();
  const wr=windowEl.getBoundingClientRect();
  const ir=cropImg.getBoundingClientRect();

  const scaleX=cropImg.naturalWidth/ir.width;
  const scaleY=cropImg.naturalHeight/ir.height;

  let sx=(wr.left-ir.left)*scaleX;
  let sy=(wr.top-ir.top)*scaleY;
  let sw=wr.width*scaleX;
  let sh=wr.height*scaleY;

  sx=Math.max(0,Math.min(sx,cropImg.naturalWidth-1));
  sy=Math.max(0,Math.min(sy,cropImg.naturalHeight-1));
  sw=Math.min(sw,cropImg.naturalWidth-sx);
  sh=Math.min(sh,cropImg.naturalHeight-sy);

  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(sw));
  canvas.height=Math.max(1,Math.round(sh));
  const ctx=canvas.getContext('2d');
  ctx.drawImage(cropImg,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  cropTargetImg.src=canvas.toDataURL('image/png');

  cropTargetImg.style.width='180px';
  cropTargetImg.style.height='auto';
  document.getElementById('cropModal').classList.remove('show');
  requestAnimationFrame(()=>snapPlacedItem(cropTargetEl));
});

      ev2.preventDefault();
      ev2.stopPropagation();

  reader.readAsDataURL(file);
  e.target.value='';
});

async function elementToOfflinePng(element){
  // Inline all current form/select values so the exported image matches what is visible.
  const clone=element.cloneNode(true);

  // Remove temporary selection / resize UI from the exported image.
  clone.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));
  clone.querySelectorAll('.resize-handle').forEach(el=>el.remove());
  clone.querySelectorAll('.slot-image-controls').forEach(el=>el.remove());

  // Copy computed styles into the cloned tree so export works with no external CSS.
  const originalNodes=[element,...element.querySelectorAll('*')];
  const clonedNodes=[clone,...clone.querySelectorAll('*')];
  originalNodes.forEach((orig,i)=>{
    const copy=clonedNodes[i];
    if(!copy) return;
    const cs=getComputedStyle(orig);
    let styleText='';
    for(let j=0;j<cs.length;j++){
      const prop=cs[j];
      styleText+=prop+':'+cs.getPropertyValue(prop)+';';
    }
    copy.setAttribute('style',styleText);
  });

  // Make sure images are embedded as data URLs. User-selected images are already data URLs.
  const w=element.offsetWidth;
  const h=element.offsetHeight;

  const serializer=new XMLSerializer();
  const xhtml=serializer.serializeToString(clone);

  const svg=
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
      <foreignObject x="0" y="0" width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;height:${h}px;">
          ${xhtml}
        </div>
      </foreignObject>
    </svg>`;

  const svgBlob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(svgBlob);

  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{
      img.onload=resolve;
      img.onerror=reject;
      img.src=url;
    });

    const scale=2;
    const canvas=document.createElement('canvas');
    canvas.width=w*scale;
    canvas.height=h*scale;
    const ctx=canvas.getContext('2d');
    ctx.scale(scale,scale);
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);

    return await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  } finally {
    URL.revokeObjectURL(url);
  }
}

document.getElementById('saveBtn').addEventListener('click',async()=>{
  selectItem(null);
  try{
    const blob=await elementToOfflinePng(board);
    if(!blob) throw new Error('PNG作成に失敗しました');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const now=new Date();
    const y=now.getFullYear();
    const m=String(now.getMonth()+1).padStart(2,'0');
    const d=String(now.getDate()).padStart(2,'0');
    a.download=`calendar_${y}${m}${d}.png`;
    a.href=url;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){
    alert('PNG保存ができませんでした。このHTMLビューアでは画像保存が制限されている可能性があります。印刷または共有機能もお試しください。');
  }
});
