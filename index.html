<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>カレンダーを つくろう</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#cfd5df;--text:#222;--muted:#667085;--accent:#3b82f6;--danger:#c93b3b;--sat:#1f5fd1;--sun:#d43f3f;--themeMain:#222;--themeSoft:#fff;--themeText:#222;--imageGuide:#9aa3b2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;padding:10px;gap:8px}
.topcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;flex:none}
h1{font-size:clamp(22px,3.5vw,34px);margin:0 0 4px}.note{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,input{font:inherit}
button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;touch-action:manipulation}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger);border-color:var(--danger)}
button.tool{padding:10px 12px;min-height:48px}
.board-wrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;background:#e9edf5;border-radius:18px;padding:10px;overflow:hidden;position:relative}
#boardScaler{transform-origin:top center}
#calendarBoard{position:relative;width:794px;height:1123px;background:#fff;border:2px solid #222;user-select:none;overflow:hidden}
.topline{position:absolute;left:28px;right:28px;top:22px;height:88px;display:grid;grid-template-columns:1.25fr .70fr 3.05fr;gap:12px;align-items:center}
.yearbox,.monthbox,.namebox{height:64px;border:2px solid var(--themeMain);border-radius:12px;background:var(--themeSoft);color:var(--themeText);display:flex;align-items:center;justify-content:center;position:relative;padding:6px 10px;cursor:pointer}
.yearbox{padding:0 10px;overflow:hidden}
.monthbox{font-size:34px;font-weight:800}
.namebox{padding:8px}
#nameDisplay{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;text-align:center}
.ruby-label{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}.ruby-label .furigana{font-size:10px;font-weight:600;margin-bottom:2px;white-space:nowrap}.ruby-label .kanji{font-weight:800}.placeholder-label .kanji{font-size:30px;line-height:1}.placeholder-label .furigana{font-size:10px}
.year-line{width:100%;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}.year-chip{display:inline-flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:800;line-height:1}.year-sep{display:inline-block;font-size:17px;font-weight:700;line-height:1;color:#555}
.grid{position:absolute;left:28px;right:28px;top:128px;height:675px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:52px repeat(6,1fr)}
.cell{position:relative;border-right:1px solid #111;border-bottom:1px solid #111;overflow:hidden}.cell:nth-child(7n+1){border-left:1px solid #111}.cell:nth-child(-n+7){border-top:1px solid #111}.weekcell{background:#f8f9fb}
.weekday-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer}.weekday-label.sat{color:var(--sat)}.weekday-label.sun{color:var(--sun)}
.date-label{position:absolute;left:7px;top:5px;font-size:26px;font-weight:800;line-height:1}.date-label.anchor{outline:3px solid rgba(59,130,246,.32);border-radius:6px;padding:2px;cursor:pointer}.date-label.sat{color:var(--sat)}.date-label.sun{color:var(--sun)}
.image-frame{position:absolute;left:28px;right:28px;top:830px;height:255px;border:0;border-radius:0;background:#fff}.image-frame-body{position:absolute;inset:10px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.image-frame-body.layout-left-large{grid-template-columns:1.45fr .85fr}.image-frame-body.layout-right-large{grid-template-columns:.85fr 1.45fr}.image-slot{position:relative;border-radius:10px;background:#fff;overflow:hidden;cursor:pointer}.image-slot.empty{border:1.5px dashed var(--imageGuide);background:#fff}.image-slot:not(.empty){border:0;background:transparent}.image-slot.selected{outline:4px solid rgba(59,130,246,.35)}.image-slot-label{display:none}.image-slot.empty .image-slot-label{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;color:#8a94a3;font-size:20px;font-weight:800;pointer-events:none}.image-slot img{position:absolute;left:50%;top:50%;width:auto;height:auto;max-width:none;max-height:none;transform-origin:center center;pointer-events:none;user-select:none}
.placing-hint{position:absolute;left:12px;right:12px;top:12px;display:none;padding:11px 14px;border:2px solid var(--accent);border-radius:12px;background:#eef5ff;font-weight:800;z-index:20}
.placing-hint.show{display:block}.target-ready{background:#eef5ff!important;box-shadow:inset 0 0 0 3px rgba(59,130,246,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9999;padding:12px}.modal.show{display:flex}.dialog{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:16px;border:2px solid #bbb}.dialog h2{font-size:24px;margin:0 0 10px}.dialog .help{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}.choice-grid button{min-height:54px;font-size:22px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kana-preview{min-height:60px;border:2px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:10px 14px;font-size:30px;font-weight:800;margin-bottom:12px}.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.kana-grid button{font-size:24px;min-height:54px;padding:6px}
.range-row{display:grid;grid-template-columns:84px 1fr 42px;gap:8px;align-items:center;margin-top:9px}.range-row input{width:100%}.range-row output{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:700px){.toolbar{gap:6px}.tool{padding:8px 10px}.dialog{padding:12px}.choice-grid button{font-size:20px}}
</style>
</head>
<body>
<div class="app">
  <div class="topcard" id="topCard">
    <h1>カレンダーを つくろう</h1>
    <p class="note">したにスクロールして選ぶのではなく、この画面だけで作れる版です。年・月・曜日・「1」・名前・画像を、上のボタンやカレンダーをタップして決めます。</p>
    <div class="toolbar">
      <button id="yearBtn" class="tool">ねん</button>
      <button id="monthBtn" class="tool">つき</button>
      <button id="weekdayBtn" class="tool">ようびの はじまり</button>
      <button id="dateBtn" class="tool">「1」をおく</button>
      <button id="nameBtn" class="tool">なまえ</button>
      <button id="img1Btn" class="tool">がぞう1</button>
      <button id="img2Btn" class="tool">がぞう2</button>
      <button id="colorBtn" class="tool">いろ</button>
      <button id="layoutBtn" class="tool">しゃしんの ならび</button>
      <button id="resetBtn" class="tool">ぜんぶ もどす</button>
      <button id="saveBtn" class="tool primary">PNGで ほぞん</button>
      <button id="pdfSaveBtn" class="tool">PDFで ほぞん</button>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div id="placingHint" class="placing-hint"></div>
    <div id="boardScaler">
      <div id="calendarBoard">
        <div class="topline">
          <div id="yearBox" class="yearbox" title="ねんを えらぶ"></div>
          <div id="monthBox" class="monthbox" title="つきを えらぶ"></div>
          <div class="namebox" id="nameBox"><div id="nameDisplay"></div></div>
        </div>
        <div id="grid" class="grid"></div>
        <div class="image-frame"><div id="imageFrameBody" class="image-frame-body">
          <div id="imageSlot1" class="image-slot empty"><span class="image-slot-label">がぞう 1</span></div>
          <div id="imageSlot2" class="image-slot empty"><span class="image-slot-label">がぞう 2</span></div>
        </div></div>
      </div>
    </div>
  </div>
</div>

<div id="choiceModal" class="modal"><div class="dialog">
  <h2 id="choiceTitle"></h2>
  <div id="choiceHelp" class="help"></div>
  <div id="choiceGrid" class="choice-grid"></div>
  <div class="modal-actions" id="choiceActions"></div>
</div></div>

<div id="kanaModal" class="modal"><div class="dialog">
  <h2>なまえを いれよう</h2>
  <div id="kanaPreview" class="kana-preview"></div>
  <div id="kanaGrid" class="kana-grid"></div>
  <div class="modal-actions">
    <button id="dakutenBtn">゛</button><button id="handakutenBtn">゜</button><button id="smallBtn">ちいさく</button><button id="spaceBtn">スペース</button><button id="backBtn">1もじ けす</button><button id="clearNameBtn">ぜんぶ けす</button><button id="nameOkBtn" class="primary">けってい</button><button id="nameCancelBtn">やめる</button>
  </div>
</div></div>

<div id="imageModal" class="modal"><div class="dialog">
  <h2 id="imageModalTitle">がぞう</h2>
  <div class="help">この画面で画像をえらび、大きさ・よこ・たてを調整します。はみ出した部分は自動で切り抜かれます。</div>
  <label style="display:inline-block;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;">画像をえらぶ<input id="imageFileInput" type="file" accept="image/*" style="display:none"></label>
  <div class="range-row"><span>おおきさ</span><input id="imgZoom" type="range" min="100" max="250" value="100"><output id="imgZoomOut">100%</output></div>
  <div class="range-row"><span>よこ</span><input id="imgX" type="range" min="-100" max="100" value="0"><output id="imgXOut">0</output></div>
  <div class="range-row"><span>たて</span><input id="imgY" type="range" min="-100" max="100" value="0"><output id="imgYOut">0</output></div>
  <div class="modal-actions"><button id="clearImageBtn" class="danger">画像を けす</button><button id="closeImageBtn" class="primary">とじる</button></div>
</div></div>

<div id="saveModal" class="modal"><div class="dialog">
  <h2 id="saveModalTitle">ほぞん</h2>
  <div id="saveModalHelp" class="help"></div>
  <div style="display:flex;justify-content:center;margin:10px 0 14px;"><img id="savePreview" alt="保存するカレンダー" style="max-width:100%;max-height:48vh;border:1px solid #ddd;border-radius:10px;background:#fff"></div>
  <div class="modal-actions"><button id="shareSaveBtn" class="primary">ほぞん・きょうゆう</button><button id="closeSaveBtn">とじる</button></div>
</div></div>

<script>
const board=document.getElementById('calendarBoard');
const boardWrap=document.getElementById('boardWrap');
const boardScaler=document.getElementById('boardScaler');
const topCard=document.getElementById('topCard');
const grid=document.getElementById('grid');
const monthBox=document.getElementById('monthBox');
const yearBox=document.getElementById('yearBox');
const nameDisplay=document.getElementById('nameDisplay');
const imageFrameBody=document.getElementById('imageFrameBody');
const weekdayNames=['月','火','水','木','金','土','日'];
const weekdayReading={月:'げつ',火:'か',水:'すい',木:'もく',金:'きん',土:'ど',日:'にち'};
const yearRange=[...Array(17)].map((_,i)=>2020+i);
let currentYear=null, monthValue=null, weekdayState=null, dateAnchor=null, placing=null, kanaBuffer='';
const imageStates=[{src:null,zoom:100,x:0,y:0},{src:null,zoom:100,x:0,y:0}];
let currentImageSlot=0;
let themeKey='none', imageLayout='equal';
const themeOptions={none:{label:'いろなし',main:'#222',soft:'#fff',text:'#222'},blue:{label:'あお',main:'#4f83e1',soft:'#eef4ff',text:'#2f4f86'},green:{label:'みどり',main:'#4fa36a',soft:'#effaf2',text:'#2d6a3f'},orange:{label:'オレンジ',main:'#e08b3e',soft:'#fff4e9',text:'#8a5420'},purple:{label:'むらさき',main:'#8b6bd6',soft:'#f4efff',text:'#5d4498'}};

function eraText(year){
  if(year>=2019){const n=year-2018; return '令和'+(n===1?'元':n)+'年';}
  if(year>=1989){const n=year-1988; return '平成'+(n===1?'元':n)+'年';}
  if(year>=1926){const n=year-1925; return '昭和'+(n===1?'元':n)+'年';}
  return '';
}
function applyTheme(){
  const t=themeOptions[themeKey]||themeOptions.none;
  document.documentElement.style.setProperty('--themeMain',t.main);
  document.documentElement.style.setProperty('--themeSoft',t.soft);
  document.documentElement.style.setProperty('--themeText',t.text);
}
function applyImageLayout(){
  imageFrameBody.className='image-frame-body';
  if(imageLayout==='left-large') imageFrameBody.classList.add('layout-left-large');
  if(imageLayout==='right-large') imageFrameBody.classList.add('layout-right-large');
  applyImage(0);
  applyImage(1);
}
function updateYearDisplay(){
  if(currentYear==null){
    yearBox.innerHTML='<span class="ruby-label placeholder-label"><span class="furigana">ねん</span><span class="kanji">年</span></span>';
  }else{
    yearBox.innerHTML='<div class="year-line"><span class="year-chip year-seireki">'+currentYear+'年</span><span class="year-sep">｜</span><span class="year-chip year-wareki">'+eraText(currentYear)+'</span></div>';
  }
  renderDates();
}
function setMonthDisplay(){
  if(monthValue==null) monthBox.innerHTML='<span class="ruby-label placeholder-label"><span class="furigana">つき</span><span class="kanji">月</span></span>';
  else monthBox.innerHTML='<span class="ruby-label"><span class="furigana">がつ</span><span class="kanji">'+monthValue+'月</span></span>';
}
function setNameDisplay(){
  nameDisplay.innerHTML=kanaBuffer?kanaBuffer:'<span class="ruby-label placeholder-label"><span class="furigana">なまえ</span><span class="kanji">名前</span></span>';
}
function classForWeekday(n){return n==='土'?'sat':n==='日'?'sun':''}
function monthDays(y,m){return new Date(y,m,0).getDate()}

function buildGrid(){
  grid.innerHTML='';
  for(let i=0;i<49;i++){
    const cell=document.createElement('div');
    cell.className='cell'+(i<7?' weekcell':'');
    grid.appendChild(cell);
  }
}
function renderWeekdays(){
  for(let i=0;i<7;i++){
    const cell=grid.children[i]; cell.innerHTML='';
    if(!weekdayState) continue;
    const idx=(weekdayState.anchorIndex + (i-weekdayState.anchorCol)+7*100)%7;
    const name=weekdayNames[idx];
    const d=document.createElement('div'); d.className='weekday-label '+classForWeekday(name); d.innerHTML='<span class="ruby-label"><span class="furigana">'+weekdayReading[name]+'</span><span class="kanji">'+name+'</span></span>';
    d.addEventListener('click',(ev)=>{ev.stopPropagation(); openWeekdayChooser();});
    cell.appendChild(d);
  }
}
function renderDates(){
  for(let i=7;i<49;i++) grid.children[i].innerHTML='';
  if(currentYear==null || monthValue==null || dateAnchor==null) return;
  const days=monthDays(currentYear,monthValue);
  for(let d=1; d<=days; d++){
    const pos=dateAnchor+(d-1); if(pos<0||pos>=42) break;
    const cellIndex=7+pos;
    const col=pos%7;
    let weekdayClass='';
    if(weekdayState){
      const idx=(weekdayState.anchorIndex + (col-weekdayState.anchorCol)+7*100)%7;
      const name=weekdayNames[idx]; weekdayClass=classForWeekday(name);
    }
    const el=document.createElement('div'); el.className='date-label '+weekdayClass+(d===1?' anchor':''); el.textContent=String(d);
    if(d===1) el.addEventListener('click',(ev)=>{ev.stopPropagation(); startDatePlacement();});
    grid.children[cellIndex].appendChild(el);
  }
}
function fitBoard(){
  const wrapW=boardWrap.clientWidth-20;
  const wrapH=boardWrap.clientHeight-20;
  const scale=Math.min(wrapW/794, wrapH/1123, 1);
  boardScaler.style.transform='scale('+scale+')';
  boardScaler.style.width='794px';
  boardScaler.style.height='1123px';
}
window.addEventListener('resize', ()=>{fitBoard();applyImage(0);applyImage(1);});

const placingHint=document.getElementById('placingHint');
function clearTargetHighlights(){document.querySelectorAll('.target-ready').forEach(x=>x.classList.remove('target-ready'));document.querySelectorAll('.image-slot').forEach(x=>x.classList.remove('selected'))}
function cancelPlacing(){placing=null;placingHint.classList.remove('show');placingHint.textContent='';clearTargetHighlights()}
function setWeekStart(startType){
  if(startType==='monday') weekdayState={anchorIndex:0,anchorCol:0};
  else if(startType==='sunday') weekdayState={anchorIndex:6,anchorCol:0};
  else weekdayState=null;
  renderWeekdays();
  renderDates();
  closeChoiceModal();
}
function openWeekdayChooser(){
  openChoiceModal({
    title:'ようびの はじまりを えらぼう',
    help:'「げつようび はじまり」か「にちようび はじまり」をえらぶと、7つの曜日がじどうで ならびます。',
    items:[
      {label:'げつようび はじまり',onClick:()=>setWeekStart('monday')},
      {label:'にちようび はじまり',onClick:()=>setWeekStart('sunday')}
    ],
    actions:[
      {label:'ようびを けす',className:'danger',onClick:()=>setWeekStart(null)},
      {label:'やめる',onClick:closeChoiceModal}
    ]
  });
}
function startDatePlacement(){
  placing={type:'date',value:1};
  placingHint.textContent='「1」を、おきたい日にちのマスに おこう';
  placingHint.classList.add('show');
  clearTargetHighlights();
  for(let i=7;i<49;i++) grid.children[i].classList.add('target-ready');
}
function openYearChooser(){
  openChoiceModal({title:'ねんを えらぼう',help:'えらぶと、和暦（れいわ など）も じどうで かわります。',items:yearRange.map(y=>({label:y+'年',onClick:()=>{currentYear=y;updateYearDisplay();closeChoiceModal();}})),actions:[{label:'ねんを けす',className:'danger',onClick:()=>{currentYear=null;updateYearDisplay();closeChoiceModal();}},{label:'やめる',onClick:closeChoiceModal}]});
}
function openMonthChooser(){
  openChoiceModal({title:'つきを えらぼう',help:'えらぶと、上の「月」のわくに はいります。えらびなおすと上書きされます。',items:[...Array(12)].map((_,i)=>({label:(i+1),onClick:()=>{monthValue=i+1;setMonthDisplay();renderDates();closeChoiceModal();}})),actions:[{label:'つきを けす',className:'danger',onClick:()=>{monthValue=null;setMonthDisplay();renderDates();closeChoiceModal();}},{label:'やめる',onClick:closeChoiceModal}]});
}
function openThemeChooser(){
  openChoiceModal({
    title:'いろを えらぼう',
    help:'すきないろを えらぶと、上のわくがかわります。「いろなし」で元にもどせます。',
    items:Object.entries(themeOptions).map(([key,val])=>({label:val.label,onClick:()=>{themeKey=key;applyTheme();closeChoiceModal();}})),
    actions:[{label:'やめる',onClick:closeChoiceModal}]
  });
}
function openLayoutChooser(){
  openChoiceModal({
    title:'しゃしんの ならびを えらぼう',
    help:'画像の大きさの ならびかた を えらべます。',
    items:[
      {label:'2まい おなじ',onClick:()=>{imageLayout='equal';applyImageLayout();closeChoiceModal();}},
      {label:'ひだりを おおきく',onClick:()=>{imageLayout='left-large';applyImageLayout();closeChoiceModal();}},
      {label:'みぎを おおきく',onClick:()=>{imageLayout='right-large';applyImageLayout();closeChoiceModal();}}
    ],
    actions:[{label:'やめる',onClick:closeChoiceModal}]
  });
}

function boardPoint(e){const r=board.getBoundingClientRect(),sx=794/r.width,sy=1123/r.height;return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}}
function cellFromPoint(e,header){const p=boardPoint(e),left=28,top=128,w=738,h=675,head=52,colW=w/7,rowH=(h-head)/6;if(p.x<left||p.x>left+w)return null;const col=Math.max(0,Math.min(6,Math.floor((p.x-left)/colW)));if(header){if(p.y<top||p.y>top+head)return null;return col}if(p.y<top+head||p.y>top+h)return null;const row=Math.max(0,Math.min(5,Math.floor((p.y-(top+head))/rowH)));return row*7+col}
board.addEventListener('click',(e)=>{
  if(!placing) return;
  if(placing.type==='date'){
    const pos=cellFromPoint(e,false); if(pos==null) return;
    dateAnchor=pos; renderDates(); cancelPlacing();
  }
});

function openChoiceModal({title,help,items,actions=[]}){
  const modal=document.getElementById('choiceModal');
  document.getElementById('choiceTitle').textContent=title;
  document.getElementById('choiceHelp').textContent=help||'';
  const grid=document.getElementById('choiceGrid'); grid.innerHTML='';
  items.forEach(item=>{const b=document.createElement('button'); b.type='button'; b.innerHTML=item.label; if(item.className) b.classList.add(item.className); b.addEventListener('click',item.onClick); grid.appendChild(b);});
  const actionsBox=document.getElementById('choiceActions'); actionsBox.innerHTML='';
  actions.forEach(a=>{const b=document.createElement('button'); b.type='button'; b.textContent=a.label; if(a.className) b.classList.add(a.className); b.addEventListener('click',a.onClick); actionsBox.appendChild(b);});
  modal.classList.add('show');
}
function closeChoiceModal(){document.getElementById('choiceModal').classList.remove('show')}

function renderImage(i){const slot=document.getElementById('imageSlot'+(i+1)); slot.querySelector('img')?.remove(); const s=imageStates[i]; if(!s.src){slot.classList.add('empty'); return;} slot.classList.remove('empty'); const img=document.createElement('img'); img.src=s.src; img.alt='えらんだ画像'; slot.appendChild(img); img.onload=()=>applyImage(i)}
function applyImage(i){const slot=document.getElementById('imageSlot'+(i+1)),img=slot.querySelector('img'),s=imageStates[i]; if(!img)return; const sw=slot.clientWidth,sh=slot.clientHeight,iw=img.naturalWidth,ih=img.naturalHeight; const base=Math.max(sw/iw,sh/ih); const scale=base*(s.zoom/100); img.style.width=(iw*scale)+'px'; img.style.height=(ih*scale)+'px'; img.style.left=(sw/2+s.x*sw/200)+'px'; img.style.top=(sh/2+s.y*sh/200)+'px'; img.style.transform='translate(-50%,-50%)'}
function openImageModal(i){ currentImageSlot=i; clearTargetHighlights(); document.getElementById('imageSlot'+(i+1)).classList.add('selected'); const s=imageStates[i]; document.getElementById('imageModalTitle').textContent='がぞう '+(i+1); document.getElementById('imgZoom').value=s.zoom; document.getElementById('imgX').value=s.x; document.getElementById('imgY').value=s.y; document.getElementById('imgZoomOut').textContent=s.zoom+'%'; document.getElementById('imgXOut').textContent=s.x; document.getElementById('imgYOut').textContent=s.y; document.getElementById('imageModal').classList.add('show'); }
function closeImageModal(){ document.getElementById('imageModal').classList.remove('show'); clearTargetHighlights(); }
['imgZoom','imgX','imgY'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{const s=imageStates[currentImageSlot]; s.zoom=Number(document.getElementById('imgZoom').value); s.x=Number(document.getElementById('imgX').value); s.y=Number(document.getElementById('imgY').value); document.getElementById('imgZoomOut').textContent=s.zoom+'%'; document.getElementById('imgXOut').textContent=s.x; document.getElementById('imgYOut').textContent=s.y; applyImage(currentImageSlot);}));
document.getElementById('imageFileInput').addEventListener('change',(e)=>{const f=e.target.files?.[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{imageStates[currentImageSlot]={src:ev.target.result,zoom:100,x:0,y:0}; renderImage(currentImageSlot); openImageModal(currentImageSlot);}; r.readAsDataURL(f); e.target.value='';});
document.getElementById('clearImageBtn').onclick=()=>{imageStates[currentImageSlot]={src:null,zoom:100,x:0,y:0}; renderImage(currentImageSlot); openImageModal(currentImageSlot);};
document.getElementById('closeImageBtn').onclick=closeImageModal;

kanaChars.forEach(ch=>{const b=document.createElement('button'); b.textContent=ch; b.onclick=()=>{kanaBuffer+=ch; kanaPreview.textContent=kanaBuffer}; kanaGrid.appendChild(b)});
const dakutenMap={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'}, handakuMap={は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ'}, smallMap={あ:'ぁ',い:'ぃ',う:'ぅ',え:'ぇ',お:'ぉ',や:'ゃ',ゆ:'ゅ',よ:'ょ',つ:'っ'};
function replaceLast(map){if(!kanaBuffer)return;const a=[...kanaBuffer],last=a.pop(); if(map[last]) kanaBuffer=a.join('')+map[last]; kanaPreview.textContent=kanaBuffer}
function openNameModal(){ kanaPreview.textContent=kanaBuffer; kanaModal.classList.add('show'); }
document.getElementById('dakutenBtn').onclick=()=>replaceLast(dakutenMap); document.getElementById('handakutenBtn').onclick=()=>replaceLast(handakuMap); document.getElementById('smallBtn').onclick=()=>replaceLast(smallMap); document.getElementById('spaceBtn').onclick=()=>{kanaBuffer+=' '; kanaPreview.textContent=kanaBuffer}; document.getElementById('backBtn').onclick=()=>{kanaBuffer=[...kanaBuffer].slice(0,-1).join(''); kanaPreview.textContent=kanaBuffer}; document.getElementById('clearNameBtn').onclick=()=>{kanaBuffer=''; kanaPreview.textContent=''}; document.getElementById('nameOkBtn').onclick=()=>{setNameDisplay(); kanaModal.classList.remove('show')}; document.getElementById('nameCancelBtn').onclick=()=>kanaModal.classList.remove('show');

function resetAll(){cancelPlacing(); currentYear=null; monthValue=null; weekdayState=null; dateAnchor=null; kanaBuffer=''; themeKey='none'; imageLayout='equal'; applyTheme(); applyImageLayout(); updateYearDisplay(); setMonthDisplay(); setNameDisplay(); renderWeekdays(); renderDates(); for(let i=0;i<2;i++){imageStates[i]={src:null,zoom:100,x:0,y:0}; renderImage(i);} closeChoiceModal(); closeImageModal(); kanaModal.classList.remove('show'); }
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script'); s.src=src; s.onload=resolve; s.onerror=reject; document.head.appendChild(s)})}
let currentSaveFile=null;
let currentSaveUrl=null;
function closeSaveModal(){
  document.getElementById('saveModal').classList.remove('show');
  if(currentSaveUrl){URL.revokeObjectURL(currentSaveUrl);currentSaveUrl=null;}
  currentSaveFile=null;
}
document.getElementById('closeSaveBtn').onclick=closeSaveModal;
document.getElementById('shareSaveBtn').onclick=async()=>{
  if(!currentSaveFile)return;
  try{
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[currentSaveFile]}))){
      await navigator.share({files:[currentSaveFile],title:currentSaveFile.name});
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError')return;
    console.warn('share failed',e);
  }
  try{
    const a=document.createElement('a');
    a.href=currentSaveUrl;
    a.download=currentSaveFile.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    alert('保存できませんでした。「ほぞん・きょうゆう」から“ファイル”に保存を選んでください。');
  }
};

async function captureCalendarCanvas(){
  if(typeof html2canvas==='undefined') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  cancelPlacing();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

  const wrapRect=boardWrap.getBoundingClientRect();
  const boardRect=board.getBoundingClientRect();
  const shot=await html2canvas(boardWrap,{
    backgroundColor:'#e9edf5',
    scale:2,
    useCORS:true,
    logging:false,
    windowWidth:document.documentElement.clientWidth,
    windowHeight:document.documentElement.clientHeight,
    scrollX:0,
    scrollY:0
  });

  const sx=shot.width/wrapRect.width;
  const sy=shot.height/wrapRect.height;
  let x=Math.round((boardRect.left-wrapRect.left)*sx);
  let y=Math.round((boardRect.top-wrapRect.top)*sy);
  let w=Math.round(boardRect.width*sx);
  let h=Math.round(boardRect.height*sy);
  x=Math.max(0,Math.min(x,shot.width-1));
  y=Math.max(0,Math.min(y,shot.height-1));
  w=Math.max(1,Math.min(w,shot.width-x));
  h=Math.max(1,Math.min(h,shot.height-y));

  const cropped=document.createElement('canvas');
  cropped.width=w;
  cropped.height=h;
  const ctx=cropped.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(shot,x,y,w,h,0,0,w,h);
  return cropped;
}

function baseCalendarName(){
  return (currentYear!=null && monthValue!=null) ? `${currentYear}年${monthValue}月カレンダー` : 'カレンダー';
}

function showSaveModal(file,previewUrl,kind){
  if(currentSaveUrl) URL.revokeObjectURL(currentSaveUrl);
  currentSaveUrl=previewUrl;
  currentSaveFile=file;
  document.getElementById('savePreview').src=previewUrl;
  document.getElementById('saveModalTitle').textContent=kind==='pdf'?'PDFを ほぞん':'PNGを ほぞん';
  document.getElementById('saveModalHelp').textContent=kind==='pdf'
    ? 'A4たてのPDFを作りました。「ほぞん・きょうゆう」を押して、iPadの共有画面から「“ファイル”に保存」を選んでください。'
    : 'カレンダーの画像を作りました。「ほぞん・きょうゆう」を押して、iPadの共有画面から「“ファイル”に保存」または「画像を保存」を選んでください。';
  document.getElementById('saveModal').classList.add('show');
}

document.getElementById('saveBtn').onclick=async()=>{
  try{
    const cropped=await captureCalendarCanvas();
    const filename=baseCalendarName()+'.png';
    const blob=await new Promise((resolve,reject)=>cropped.toBlob(b=>b?resolve(b):reject(new Error('PNG変換に失敗しました')),'image/png'));
    const url=URL.createObjectURL(blob);
    const file=new File([blob],filename,{type:'image/png'});
    showSaveModal(file,url,'png');
  }catch(e){
    console.error(e);
    alert('PNGを作成できませんでした。');
  }
};

document.getElementById('pdfSaveBtn').onclick=async()=>{
  try{
    const cropped=await captureCalendarCanvas();
    if(!window.jspdf || !window.jspdf.jsPDF){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js');
    }
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    const pageW=210,pageH=297,margin=8;
    const maxW=pageW-margin*2,maxH=pageH-margin*2;
    const ratio=cropped.width/cropped.height;
    let drawW=maxW,drawH=drawW/ratio;
    if(drawH>maxH){drawH=maxH;drawW=drawH*ratio;}
    const x=(pageW-drawW)/2;
    const y=(pageH-drawH)/2;
    const imgData=cropped.toDataURL('image/jpeg',0.96);
    pdf.addImage(imgData,'JPEG',x,y,drawW,drawH,undefined,'FAST');
    const blob=pdf.output('blob');
    const filename=baseCalendarName()+'.pdf';
    const pdfUrl=URL.createObjectURL(blob);
    const file=new File([blob],filename,{type:'application/pdf'});

    // PDFそのものはimgタグでプレビューできないため、画面では同じカレンダー画像を表示する。
    const previewBlob=await new Promise((resolve,reject)=>cropped.toBlob(b=>b?resolve(b):reject(new Error('プレビュー作成に失敗しました')),'image/png'));
    const previewUrl=URL.createObjectURL(previewBlob);
    if(currentSaveUrl) URL.revokeObjectURL(currentSaveUrl);
    currentSaveUrl=pdfUrl;
    currentSaveFile=file;
    document.getElementById('savePreview').src=previewUrl;
    document.getElementById('saveModalTitle').textContent='PDFを ほぞん';
    document.getElementById('saveModalHelp').textContent='A4たてのPDFを作りました。「ほぞん・きょうゆう」を押して、iPadの共有画面から「“ファイル”に保存」を選んでください。';
    document.getElementById('saveModal').classList.add('show');
    // previewUrl はモーダルを閉じた後に画像要素から外れれば回収される。少し遅らせて解放する。
    setTimeout(()=>URL.revokeObjectURL(previewUrl),60000);
  }catch(e){
    console.error(e);
    alert('PDFを作成できませんでした。インターネット接続を確認して、もう一度お試しください。');
  }
};
